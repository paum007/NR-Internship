; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = upesy_wroom
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:transmitter]
build_src_filter = -<*> +<transmitter.cpp>
; upload_port = COM7
; monitor_port = COM7

[env:receiver]
build_src_filter = -<*> +<receiver.cpp>
; upload_port = COM4
; monitor_port = COM4
lib_deps =
    madhephaestus/ESP32Servo

[env:finger_curl]
build_src_filter = -<*> +<finger_curl.cpp>
; upload_port = COM5
; monitor_port = COM5
lib_deps =
    madhephaestus/ESP32Servo

[env:pca9685_testing]
build_src_filter = -<*> +<pca9685_testing.cpp>
lib_deps = 
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.0

[env:magneto]
build_src_filter = -<*> +<magnetometer.cpp>
lib_deps=
    adafruit/Adafruit LIS3MDL@^1.2.5

[env:microros]
board_microros_distro = humble
board_microros_transport = wifi
build_src_filter = -<*> +<ros_node.cpp>
; upload_port = COM5
; monitor_port = COM5
lib_deps=
    https://github.com/micro-ROS/micro_ros_platformio

[env:delay]
board_microros_distro = jazzy
board_microros_transport = wifi
build_src_filter = -<*> +<delay_testing_ros.cpp>
; upload_port = COM5
; monitor_port = COM5
lib_deps=
    https://github.com/micro-ROS/micro_ros_platformio

[env:finger_movement]
board_microros_distro = jazzy
board_microros_transport = wifi
build_src_filter = -<*> +<finger_movement.cpp>
monitor_filters = default, log2file
; upload_port = COM5
; monitor_port = COM5
lib_deps=
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.0
    https://github.com/micro-ROS/micro_ros_platformio

[env:mac]
build_src_filter = -<*> +<mac.cpp>
